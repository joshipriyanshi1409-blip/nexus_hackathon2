services:
  web:
    build: .
    container_name: echo-brandgov-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
