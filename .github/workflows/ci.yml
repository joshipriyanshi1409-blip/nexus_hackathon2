name: ECHO CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q backend tests

      # Offline tests only: live tests (real Supabase / model / browser) are skipped without RUN_LIVE_TESTS=1.
      - name: Offline tests
        run: python -m pytest -q

      # Rules-only benchmark: no API key, no network. The LLM modes are never run in CI.
      - name: Rules-only benchmark
        run: python tests/run_evaluation.py
