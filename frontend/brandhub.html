async function api(p,method='GET',body){
  const h={};if(tok)h.Authorization='Bearer '+tok;
  let b;if(body instanceof FormData)b=body;else if(body){h['Content-Type']='application/json';b=JSON.stringify(body)}

  let j={};try{j=await r.json()}catch(e){}
  if(r.status==401&&tok&&p!='/login'){endSession()}
  if(!r.ok)throw new Error(typeof j.detail=='string'?j.detail:'Something went wrong ('+r.status+').');
  return j;
}

}

function loadApprovedFacts(){
  api('/facts').then(rows=>{const el=$('#approved_facts_list');if(!el)return;el.innerHTML=rows.map(f=>`<div class="r"><span><strong>${esc(f.name)}: ${esc(f.value)}</strong><br><small class="m">${esc(f.source_title)} ${f.source_url?`· <a href="${esc(f.source_url)}" target="_blank" rel="noopener">evidence</a>`:''}</small></span><button class="s" onclick="deleteApprovedFact(${f.id})">Delete</button></div>`).join('')||'<p class="m">No approved facts saved yet.</p>'}).catch(e=>{const el=$('#approved_facts_list');if(el)el.textContent=e.message});
}
function addApprovedFact(){
  const payload={name:V('fact_name').trim(),value:V('fact_value').trim(),source_title:V('fact_source').trim(),source_url:V('fact_url').trim()};
  if(!payload.name||!payload.value||!payload.source_title){say('Enter a fact name, approved value and evidence title.');return draw()}
  act(()=>api('/facts','POST',payload),'Approved fact saved.');
}
function deleteApprovedFact(id){if(confirm('Delete this approved fact?'))act(()=>api('/facts/'+id,'DELETE'),'Approved fact deleted.')}
function runFactBenchmark(){
  let payload;try{payload=JSON.parse(V('fact_benchmark_json'))}catch(e){say('Benchmark input must be valid JSON.');return draw()}
  if(!payload||!Array.isArray(payload.posts)||!payload.posts.length){say('Add a non-empty posts array.');return draw()}
  const el=$('#fact_benchmark_result');if(el)el.textContent='Running benchmark...';
  api('/facts/evaluate','POST',payload).then(r=>{const target=$('#fact_benchmark_result');if(target)target.innerHTML=`<p><strong>${r.detected_wrong_fact_posts}/${r.wrong_fact_posts}</strong> wrong-fact posts detected · Recall ${(r.recall*100).toFixed(1)}% · Precision ${(r.precision*100).toFixed(1)}% · F1 ${(r.f1*100).toFixed(1)}%</p><p class="m">${r.posts_tested} posts · ${esc(r.model)} · AI used: ${r.used_ai?'Yes':'No'} · ${r.approved_facts_available} approved facts loaded</p>${r.baseline_posts_compared?`<p class="m">Baseline: ${r.baseline_detected_wrong_fact_posts} detected across ${r.baseline_posts_compared} labelled posts (recall ${(r.baseline_recall*100).toFixed(1)}%).</p>`:'<p class="m">Add baseline_detected to each post to calculate a before/after comparison.</p>'}`}).catch(e=>{const target=$('#fact_benchmark_result');if(target)target.textContent=e.message});
}

function saveRules(){
  const L=s=>s.split(',').map(x=>x.trim()).filter(Boolean),t={};
  for(const k in S.rules.target)t[k]=Math.min(10,Math.max(1,+V('rt_'+k)||S.rules.target[k]));
  act(()=>api('/rules','PUT',{
    avoid:L(V('ra')),proof:L(V('rc')),
    prefer:V('rp').split('\n').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x[0]&&x[1]),
    target:t,departments:S.departments
  }),'Rules saved.');
}

function addDept(){const n=V('nd_name').trim();if(n)act(()=>api('/departments','POST',{name:n}),'Department added.')}
function delDept(n){if(confirm('Delete department '+n+'?'))act(()=>api('/departments/'+encodeURIComponent(n),'DELETE'),'Department deleted.')}
function addSrc(){
  const fd=new FormData();fd.append('kind',V('kk'));fd.append('title',V('kt'));fd.append('text',V('kx'));
  const f=$('#kf').files[0];if(f)fd.append('file',f);
  if(!V('kt').trim()){say('Give it a title.');return draw()}
  act(()=>api('/sources','POST',fd),'Added to knowledge base.');
}
function delSrc(id){if(confirm('Remove this source?'))act(()=>api('/sources/'+id,'DELETE'),'Removed.')}

function takeBack(u){act(()=>api('/users/'+encodeURIComponent(u)+'/takeback','POST'),'Authority taken back.')}

// ---------- CHECK MY POST SCREEN ----------
function check(m){
  const f=cur.f,sc=f?L_score(f):0;
  const results=cur.loading?`<div class="help-card" style="margin-top:14px"><span class="spinner"></span><strong>Checking your draft…</strong><p class="m" style="margin-top:8px">Applying saved brand standards, approved facts and relevant references. The AI provider may take a few seconds to respond.</p></div>`:
    f?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0"><span class="t ${sc>=8?'g':sc>=5?'a':'x'}">Brand score: ${sc}/10</span><span class="t ${cur.used_ai?'g':'a'}">${cur.used_ai?'AI-assisted review':'Rules and approved-fact check'}</span></div>
      <div class="help-card" style="margin-bottom:12px">${f.length?`ECHO found <strong>${f.length} item${f.length===1?'':'s'}</strong> to review. Check the explanation and suggested action for each one.`:'<strong>No issues found.</strong> The draft passed the configured checks. Review the wording yourself before publishing.'}</div>
      ${f.map((x,i)=>{
        const stBadge=x.status=='accepted'?'<span class="t g">Accepted</span>':x.status=='rejected'?'<span class="t x">Dismissed</span>':x.status=='edited'?'<span class="t a">Edited</span>':'<span class="t a">Needs review</span>';
        return `<div class="standard-card" style="padding:16px;margin:12px 0"><div class="check-title"><strong>${esc(x.m)}</strong>${stBadge}</div>
          <p style="margin:10px 0 4px"><strong>Text found:</strong> “${esc(x.q||x.quote||'')}”</p>
          <p class="check-help"><strong>Why it matters:</strong> ${esc(x.why||x.r||'This item matches a saved brand standard.')}</p>
          ${x.source_title?`<p class="check-help"><strong>Evidence:</strong> ${esc(x.source_title)} ${x.source_url?`· <a href="${esc(x.source_url)}" target="_blank" rel="noopener">Open source</a>`:''}</p>`:''}
          ${x.sug?`<p class="check-help"><strong>Suggested change:</strong> ${esc(x.edited||x.sug)}</p>`:''}
          <p class="m" style="font-size:12px">Source: ${esc(x.origin||'brand standards')} · Severity: ${esc(x.sev||'medium')} · Confidence: ${esc(x.conf||'high')}</p>
          <div class="check-action">${x.fix?`<button class="s" onclick="fixIt(${i})">Apply quick fix</button>`:''}<button class="s" onclick="setFindingAction(${i},'accepted')">Accept</button><button class="s" onclick="setFindingAction(${i},'rejected')">Dismiss</button><button class="s" onclick="openEditFindingModal(${i})">Edit response</button></div>
        </div>`;
      }).join('')}`:
    `<div class="result-empty"><div><span class="result-empty-icon">${iconSvg('check')}</span><strong>Ready to review your draft</strong><p class="m" style="margin:7px auto 0;max-width:250px">Run a brand check to see matched rules, fact mismatches, source evidence and suggested corrections.</p></div></div>`;
  return `<div class="check-page-intro"><div class="check-title"><div><span class="dashboard-eyebrow">CONTENT REVIEW</span><h2>Check my post</h2><p class="m" style="line-height:1.6;max-width:720px">Paste a caption, announcement or campaign draft. ECHO checks it against your saved writing standards and approved product facts before you send it to the team.</p></div></div><div class="check-mode-note"><strong>What gets checked</strong><br>Drafts are compared with your saved wording rules, required evidence terms and approved product facts. Review each finding before sending the draft to your team.</div></div>
  <div class="check-grid">
    <section class="c"><div class="check-title"><h3 style="font-size:22px">1. Your draft</h3><span class="m" style="font-size:12px">Up to 20,000 characters</span></div>
      <label for="ct">Paste or edit your content</label><textarea class="i check-input" id="ct" placeholder="Paste your social post, product announcement or campaign copy here…">${esc(cur.text)}</textarea>
      <p class="check-help">You can also upload a document. Supported formats: TXT, Markdown, PDF and DOCX.</p><input type="file" accept=".txt,.md,.pdf,.docx" onchange="readF(this)" aria-label="Upload document">
      <div class="check-action"><button class="b" onclick="runCheck()" ${cur.loading?'disabled':''}>${cur.loading?'<span class="spinner"></span>Checking…':'Run brand check'}</button><button class="s" onclick="clearCheck()" ${cur.loading?'disabled':''}>Clear draft</button></div>
      <div style="border-top:1px solid #E4DFD3;margin-top:20px;padding-top:18px"><h3 style="font-size:18px">Optional: check an image</h3><p class="check-help">The current image check is limited to dominant-colour contrast. It does not verify image meaning or all accessibility requirements.</p><input type="file" id="v_file" accept=".png,.jpg,.jpeg" onchange="runVisualCheck(this)" aria-label="Upload image for limited contrast check"></div>
    </section>
    <section class="c check-result"><div class="check-title"><h3 style="font-size:22px">2. Review results</h3>${f&&!cur.loading?`<span class="t ${sc>=8?'g':sc>=5?'a':'x'}">${sc}/10</span>`:''}</div>${results}</section>
  </div>
  <div class="c" style="margin-top:18px"><div class="check-title"><div><h3 style="font-size:21px">3. Send for team review</h3><p class="check-help" style="margin-bottom:0">Once you have checked the draft and resolved or acknowledged findings, submit it to the normal supervisor/head approval flow.</p></div><button class="b" onclick="sendPost()" ${cur.loading||!cur.text.trim()?'disabled':''}>Send for review</button></div></div>`;
}

function clearCheck(){if(cur.loading)return;cur={text:'',f:null,rid:null,reviewedText:undefined,used_ai:false,model:null,loading:false};draw()}

function L_score(f){
  const active=f.filter(x=>x.status!='rejected');
  return Math.max(0,10-active.reduce((a,b)=>a+(b.sev=='high'?3:b.sev=='medium'?2:1),0));
}

async function doReview(){
  if(cur.loading)return;
  cur.loading=true;cur.f=null;cur.used_ai=false;cur.model=null;draw();
  try{
    const r=await api('/review','POST',{text:cur.text});
    cur.f=r.findings;cur.rid=r.review_id;cur.reviewedText=cur.text;cur.used_ai=r.used_ai;cur.model=r.model;
    say(r.used_ai?'AI-assisted review complete.':'Rules and approved-fact check complete.');
  }catch(e){say(e.message);cur.f=null}
  finally{cur.loading=false;draw()}
}

function runCheck(){cur.text=V('ct');if(!cur.text.trim()){say('Enter content first.');return draw()}doReview()}
async function readF(i){
  const f=i.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await api('/extract','POST',fd);   // the server reads PDF/DOCX; the browser cannot
    cur.text=r.text;
    await doReview();
    if(r.truncated){say('Only the first 20,000 characters of that file were checked.');draw()}
  }catch(e){say(e.message);draw()}
}
function fixIt(i){
  const[a,b]=cur.f[i].fix;
  cur.text=V('ct').replace(new RegExp(reEsc(a),'gi'),()=>b).replace(/ {2,}/g,' ');
  doReview();   // the text changed, so re-check it: findings, score and review id stay consistent
}

async function setFindingAction(idx,action,edited_text=''){
  if(!cur.rid||cur.f[idx].local){cur.f[idx].status=action;if(edited_text)cur.f[idx].edited=edited_text;draw();return}
  try{
    const r=await api('/reviews/'+cur.rid+'/findings/'+idx+'/action','POST',{action,edited_text});
    cur.f=r.findings;
    say('Finding marked as '+action+'.');
  }catch(e){say(e.message)}
  draw();
}

async function runVisualCheck(input){
  const file=input.files[0];if(!file)return;
  const fd=new FormData();fd.append('file',file);
  try{
    const r=await api('/check/visual','POST',fd);
    if(!cur.f)cur.f=[];
    cur.f.push(...r.findings.map(x=>({...x,local:true})));   // image findings live only in this browser session

async function sendPost(){
  const t=V('ct').trim();if(!t){say('Write or upload content first.');return draw()}
  try{
    const body={text:t};
    if(cur.rid&&cur.reviewedText!==undefined&&String(cur.reviewedText).trim()===t)body.review_id=cur.rid;   // keep accept/reject/edit choices

function review(m){
  const canDecide=has(m,'review')||has(m,'approve');
  const isMine=p=>String(p.by||'').toLowerCase()===String(ses||'').toLowerCase();
  const mineP=S.posts.filter(isMine);
  const wait=S.posts.filter(p=>!isMine(p)&&(p.status==='Waiting'||(p.status==='Recommended'&&has(m,'approve'))));
  const chip=p=>`<span class="t ${p.status==='Approved'?'g':(p.status==='Waiting'||p.status==='Recommended')?'a':'x'}">${esc(p.status)}</span>`;
  const row=(p,canAct)=>`<article class="review-post"><div class="review-post-main"><div class="review-post-title"><strong>${esc(p.text.slice(0,180))}${p.text.length>180?'…':''}</strong></div><div class="review-post-meta">Post #${p.id} · by @${esc(p.by)} (${esc(p.dept||'General')}) · ${p.issues} issue${p.issues===1?'':'s'} · ${chip(p)}${p.note?' · Note: '+esc(p.note):''}</div></div><div class="review-post-actions"><button class="s" onclick="viewHistory(${p.id})">History</button>${canAct?`${has(m,'approve')?`<button class="b" onclick="decide(${p.id},'Approved')">Approve</button>`:''}${has(m,'review')&&p.status==='Waiting'?`<button class="b" onclick="decide(${p.id},'Recommended')">Recommend</button>`:''}<button class="s" onclick="decide(${p.id},'Sent back')">Send back</button>`:''}${isMine(p)&&p.status==='Sent back'?`<button class="b" onclick="openReviseModal(${p.id})">Revise</button>`:''}${m.role===0||(isMine(p)&&p.status!=='Approved')?`<button class="s danger-btn" aria-label="Delete post ${p.id}" onclick="deletePost(${p.id},${ja(p.text.slice(0,90))})">Delete</button>`:''}</div></article>`;
  return `<div class="check-title"><div><span class="dashboard-eyebrow">TEAM WORKFLOW</span><h2 style="font-size:33px;margin:6px 0">Review queue</h2><p class="m">Review posts submitted by other team members. You cannot approve your own work.</p></div><span class="t ${wait.length?'a':'g'}">${wait.length} awaiting action</span></div>${canDecide?`<section class="c" style="margin-top:16px"><div class="workspace-heading" style="margin-top:0"><h3>Waiting for your action</h3></div>${wait.length?wait.map(p=>row(p,1)).join(''):'<div class="result-empty" style="min-height:130px"><div><strong>You are all caught up</strong><p class="m" style="margin-top:6px">There are no other team submissions waiting for your review.</p></div></div>'}</section>`:''}<section class="c" style="margin-top:16px"><div class="workspace-heading" style="margin-top:0"><h3>My submissions</h3><span class="m" style="font-size:11px">${mineP.length} post${mineP.length===1?'':'s'}</span></div>${mineP.length?mineP.map(p=>row(p,0)).join(''):'<div class="result-empty" style="min-height:130px"><div><strong>No submissions yet</strong><p class="m" style="margin-top:6px">Posts you send for review will appear here.</p></div></div>'}</section>`;
}


function deletePost(id,preview){

function filterVault(query){
  const q=String(query||'').trim().toLowerCase();let shown=0;
  document.querySelectorAll('.vault-folder').forEach(card=>{const match=!q||card.dataset.search.includes(q);card.hidden=!match;if(match)shown++});
  const empty=$('#vaultNoResults');if(empty)empty.hidden=shown>0;
}

function syncFeedbackSources(){act(async()=>{const r=await api('/connectors/sync','POST',{});say(`Live sync complete: ${r.imported} imported, ${r.duplicates} duplicates skipped, ${r.pii_redactions} PII items masked.`)},null)}
async function runDemoConnectorSync(){
  const el=$('#demo_connector_result');if(el)el.textContent='Importing synthetic sample messages and reviews...';
  try{
    const r=await api('/connectors/demo-sync','POST',{});
    if(el)el.innerHTML=`<div class="t a">SIMULATED DATA ONLY</div><p><strong>${r.imported} imported</strong> · ${r.duplicates} duplicates skipped · ${r.pii_redactions} personal details masked</p><p class="m">Sample records offered: ${Object.entries(r.offered||{}).map(([k,v])=>esc(k)+': '+v).join(' · ')}. Re-running the demo is safe: existing sample records are deduplicated.</p><p class="m">${esc(r.notice)}</p>`;
    await load();
    say(`Demo sync complete: ${r.imported} synthetic records imported, ${r.duplicates} duplicates skipped, ${r.pii_redactions} personal details masked.`);
    draw();
  }catch(e){if(el)el.textContent=e.message;}
}

function evaluateComplaintGroups(){
  let labels;try{labels=JSON.parse(V('manual_complaint_labels')||'{}')}catch(e){say('Enter valid JSON mapping complaint IDs to manual group labels.');return draw()}
  const el=$('#complaint_eval_result');if(el)el.textContent='Evaluating labelled complaints...';
  api('/complaints/evaluate','POST',{labels}).then(r=>{const target=$('#complaint_eval_result');if(target)target.innerHTML=`<p><strong>Pairwise F1: ${(r.f1*100).toFixed(1)}%</strong> · Precision ${(r.precision*100).toFixed(1)}% · Recall ${(r.recall*100).toFixed(1)}% · ${r.labelled_complaints} labelled complaints</p>`}).catch(e=>{const target=$('#complaint_eval_result');if(target)target.textContent=e.message});
}

// ---------- INSIGHTS SCREEN ----------
function insights(m){
  api('/insights').then(d=>{
    const el=$('#ins');if(!el)return;
    const bar=(rows,c)=>{
      if(!rows||!rows.length)return '<p class="m" style="margin-top:10px">No data recorded.</p>';
      const mx=Math.max(1,...rows.map(x=>x[1]));
      return rows.map(x=>`<div class="r"><span style="min-width:170px">${esc(x[0])}</span><span style="flex:1;min-width:160px" class="bar"><i style="width:${x[1]/mx*100}%;background:${c}"></i></span><strong>${x[1]}</strong></div>`).join('');
    };
    el.innerHTML=`
    <div class="h">
      <div class="c"><h3 style="font-size:22px">Posts by status</h3>${bar(Object.entries(d.by_status||{}),'#1F3D36')}</div>
      <div class="c"><h3 style="font-size:22px">Common violations by type</h3>${bar(d.violations||[],'#B08A4A')}</div>
    </div>
    <div class="h">
      <div class="c"><h3 style="font-size:22px">Violations by department</h3>${bar(d.by_department||[],'#1F3D36')}</div>
      <div class="c"><h3 style="font-size:22px">Violations by author</h3>${bar(d.by_person||[],'#6B6A63')}</div>
    </div>
    <div class="c"><h3 style="font-size:22px">AI suggestions accept rate</h3>
      <p class="m">Creators accepted ${d.actions.accepted} suggestions, rejected ${d.actions.rejected}, and edited ${d.actions.edited}.</p>
      <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
        <span class="t g" style="font-size:18px">${d.actions.accept_rate}% Acceptance</span>
      </div>
    </div>
    <div class="c"><h3 style="font-size:22px">Most-triggered guidelines & rules</h3>${bar(d.top_rules||[],'#8A2F2F')}</div>
    ${d.feedback!=null?`<div class="h"><div class="c"><h3 style="font-size:22px">Customer sentiment</h3>${bar(Object.entries(d.sentiment||{}),'#1F3D36')}</div>
    <div class="c"><h3 style="font-size:22px">Top complaint topics</h3>${bar(d.complaint_topics||[],'#8A2F2F')}</div></div>
    <div class="c"><h3 style="font-size:22px">Customer satisfaction rating trend</h3>
      ${(d.trend||[]).map(t=>`<div class="r"><span>${esc(t[0])}</span><span class="m">${t[1]} / 5 from ${t[2]} comment${t[2]==1?'':'s'}</span></div>`).join('')||'<p class="m">No trend data yet.</p>'}
    </div>`:''}`;
  }).catch(e=>{const el=$('#ins');if(el)el.textContent=e.message});

  return `<h2 style="font-size:34px">Governance insights</h2><div id="ins"><p class="m">Loading analytics...</p></div>`;
}

// ---------- PUBLIC FEEDBACK FORM ----------
function publicFeedbackForm(){
  return `<div style="max-width:540px;margin:40px auto;padding:24px"><div class="c" style="display:flex;flex-direction:column;gap:16px">
  <strong style="font-family:Georgia,serif;font-size:26px;color:#1F3D36">Share Your Experience</strong>
  <p class="m">We value your honest feedback to improve our products and service.</p>
  <label>Rating (1 to 5 stars)<select class="i" id="pf_r"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3" selected>3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Terrible</option></select></label>
  <label>Your feedback<textarea class="i" id="pf_t" style="min-height:120px" placeholder="Tell us what went well or what we can do better..."></textarea></label>
  <p class="err" id="pf_e" role="alert"></p>
  <button class="b" onclick="submitPublicFeedback()">Submit feedback</button>
  <a href="#/home" style="color:#6B6A63;font-size:14px;text-align:center">Back to home</a>
  </div></div>`;
}

async function submitPublicFeedback(){
  const t=V('pf_t').trim(),r=+V('pf_r')||3,e=$('#pf_e');
  if(!t){e.textContent='Please enter your comment.';return}
  try{
    await api('/public/feedback','POST',{text:t,rating:r,source:'Public Website Form'});
    alert('Thank you! Your feedback has been received.');
    go('#/home');
  }catch(x){e.textContent=x.message;}
}

function renderModal(){
  if(!modal)return '';
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:24px">${esc(modal.title)}</h2><button class="s" style="min-height:32px;padding:4px 10px" onclick="closeModal()">✕</button></div>
  ${modal.html}</div></div>`;
}
function closeModal(){modal=null;draw()}

function draw(){
  const r=(location.hash||'#/home').slice(2);
  if(r=='feedback-form'){$('#app').innerHTML=publicFeedbackForm();return}
  if(r=='disclosure'){$('#app').innerHTML=disclosureScreen();return}
  if(r=='judges'){$('#app').innerHTML=judgesScreen();return}

  const m=me(),pub=['home','login'];
  if(!m&&!pub.includes(r))return go('#/login');
  if(m&&r=='login')return go('#/dash');
  if(!m){$('#app').innerHTML=r=='login'?loginScreen():homeScreen();return}

  const P={dash,check,review,files,voice,team,rules,audit:auditScreen,insights,disclosure:disclosureScreen};
  const okp={voice:has(m,'voice'),team:has(m,'authority'),rules:m.role==0,audit:m.role<=1};
  let k=P[r]?r:'dash';
  if(k in okp&&!okp[k]){say('You do not have permission for that section.');k='dash'}

  $('#app').innerHTML=shell(k,m,P[k](m));
  if(k=='voice')loadVoiceGap();
  toast='';
}

async function boot(){
  initTheme();
  try{const h=await (await fetch('/health')).json();demoLoginAvailable=!!h.demo_login}catch(e){}
  if(tok){try{await load()}catch(e){endSession()}}
  draw();
}

window.onhashchange=draw;
boot();
</script></body></html>
